steps:
# 1. BUILD: Use the Dockerfile in the root directory to create the container image.
# We tag the image uniquely with the commit ID ($COMMIT_SHA).
- name: 'gcr.io/cloud-builders/docker'
  args:
  - 'build'
  - '-t'
  - 'gcr.io/loyal-acre-465011-i2/clms-saas-prouduct:$COMMIT_SHA' # Your Image Registry Path
  - '.'

# 2. PUSH: Upload the newly built container image to Artifact Registry.
- name: 'gcr.io/cloud-builders/docker'
  args:
  - 'push'
  - 'gcr.io/loyal-acre-465011-i2/clms-saas-prouduct:$COMMIT_SHA'

# 3. DEPLOY: Deploy the image to the Cloud Run service in the correct region.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
  - 'run'
  - 'deploy'
  - 'clms-saas-prouduct'  # Your Cloud Run Service Name
  - '--image'
  - 'gcr.io/loyal-acre-465011-i2/clms-saas-prouduct:$COMMIT_SHA'
  - '--region'
  - 'asia-south1' # Your Region (Mumbai)
  - '--allow-unauthenticated'
  - '--min-instances=1'
  - '--max-instances=20'
  # **CRITICAL**: Securely connects to your Cloud SQL instance.
  - '--add-cloudsql-instances'
  - 'loyal-acre-465011-i2:asia-south1:clms-saas-product'
  - '--update-env-vars'
  - 'DB_DATABASE=clms_db,DB_USERNAME=clms-db-access-admin,DB_PASSWORD=cLmS@sAaS.cOm'

timeout: 1600s # Gives the build up to 26 minutes to complete all steps

images:
- 'gcr.io/loyal-acre-465011-i2/clms-saas-prouduct:$COMMIT_SHA'