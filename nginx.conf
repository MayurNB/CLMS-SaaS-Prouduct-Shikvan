server {
    # CRITICAL FIX: Use the port provided by the environment variable ($PORT) 
    # Cloud Run injects the PORT variable (default 8080).
    listen 8080 env=$PORT; 
    
    # Or, if you need to dynamically reference it via a template approach:
    # listen ${PORT}; 
    # But since Nginx is usually built to listen on 8080, we use 8080 directly 
    # in the Cloud Run environment. If your Dockerfile sets the ENV PORT=8080, 
    # using 'listen 8080;' is usually sufficient and simpler. 
    # Let's stick to the simplest working version:
    listen 8080;
    
    root /var/www/html/public;

    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Pass requests to the PHP-FPM service running inside the container
        # Use the fpm service name or 127.0.0.1 and port 9000
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Add other common Nginx settings as needed
    client_max_body_size 100M;
    keepalive_timeout 65;
}