# === CRITICAL NEW LINE ===
user www-data; 

server {
    # Nginx will listen on this port. The start.sh script will dynamically replace this with the $PORT env var.
    listen 8080;
    server_name localhost;
    # Laravel's entry point is the public directory
    root /var/www/html/public;

    # Basic setup
    client_max_body_size 25m;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    index index.php;
    charset utf-8;

    # Handle Laravel routes (try files, then pass to index.php)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP scripts to the PHP-FPM service using the Unix socket
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}